[package]
name = "villflow"
version = "0.7.0"
edition = "2021"
description = "Push-to-talk dictation powered by your own Gemini or ChatGPT sign-in"
license = "MIT"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
clipboard-win = "5"
winreg = "0.55"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Production builds embed the static UI from ../ui (no Node toolchain needed).
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
